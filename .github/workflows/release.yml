name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches plugin.json
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $version"; exit 1
          fi
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate and test the plugin
        run: scripts/check.sh
      - name: Build the release archive
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=christmas-themes/ -o "dist/christmas-themes-$GITHUB_REF_NAME.zip" HEAD
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release $GITHUB_REF_NAME" > dist/notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/christmas-themes-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
